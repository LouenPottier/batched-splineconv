[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "batched-splineconv"
version = "0.1.0"
description = "Batched SplineConv for fields defined on a fixed mesh"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["torch>=2.1", "numpy"]

[project.optional-dependencies]
# Reference implementation used by the tests. Recent PyG (2.8) moved the spline ops to
# pyg-lib >= 0.6; with older torch builds pin torch_geometric==2.6.1 + torch_spline_conv.
test = ["pytest", "scipy", "torch_geometric", "torch_spline_conv"]
bench = ["matplotlib", "scipy", "h5py"]

[tool.setuptools.packages.find]
where = ["src"]
